    <!-- The title, the description, the canonical address and the social card

         its own carries. -->
    <title>SMILES converter — draw a structure, read its SMILES</title>
    <!-- The same geometry `src/components/Brand.tsx` draws, written out with
         literal colours because a file served on its own cannot read the page's
         custom properties. Change one and change the other. -->
    <link rel="icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1c6e42" />
    <meta
      name="description"
      content="Convert between chemical structures and SMILES in both directions, search a list of structures by substructure or SMARTS, and learn the notation through a tutorial and graded exercises."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "smiles.cheminfo.org",
        "url": "https://smiles.cheminfo.org/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "description": "Convert between chemical structures and SMILES in both directions, search a list of structures by substructure or SMARTS, and learn the notation through a tutorial and graded exercises.",

        "isAccessibleForFree": true,
        "publisher": { "@type": "Organization", "name": "cheminfo" }
      }
    </script>

      <h1>smiles.cheminfo.org — structures in, structures out</h1>

        search a list of structures by substructure or SMARTS, and learn the

      </p>
