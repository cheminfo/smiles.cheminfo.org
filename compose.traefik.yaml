# Traefik deployment — no port published on the host.
#
# Requires an external Docker network named `traefik` hosting the reverse
# proxy, with a `websecure` entrypoint and a `letsencrypt` cert resolver.
#
# Select with COMPOSE_FILE=compose.traefik.yaml in .env, then:
#   docker compose up -d

services:
  smiles:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/smiles.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The pages served are written here at startup, so the analytics snippet can
    # go in them while the image filesystem stays read-only.
    tmpfs:
      - /public:rw,noexec,nosuid,size=128m
    environment:
      # Read from .env when there is one, defaulted here so a bare checkout
      # with no .env at all still starts. An empty value means "not set" to
      # the entrypoint: nothing is loaded.
      SERVER_PORT: ${PORT:-10606}
      BASE_PATH: ${BASE_PATH:-/}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
    mem_limit: 512m
    cpus: 1
    pids_limit: 512
    ulimits:
      core: 0
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    # Only the proxy's network: nothing here talks to a sibling container, and
    # naming `default` as well would have compose cut a second subnet out of a
    # pool that runs out after a few dozen stacks on one host.
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.smiles.rule=Host(`smiles.cheminfo.org`)'
      - 'traefik.http.routers.smiles.entrypoints=websecure'
      - 'traefik.http.routers.smiles.tls.certresolver=letsencrypt'
      - 'traefik.http.services.smiles.loadbalancer.server.port=${PORT:-10606}'

networks:
  traefik:
    external: true
